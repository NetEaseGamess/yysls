<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>燕云面板自定义实验室</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  :root{
    --bg:#080a0a;
    --panel:#0e1211;
    --panel-2:#0b0f0e;
    --line:#1c2825;
    --line-strong:#2c443d;
    --ink:#e6f5ee;
    --text:#b9cec6;
    --muted:#728a80;
    --accent:#5fe0a8;
    --accent-2:#a7f7cf;
    --accent-soft:rgba(95,224,168,.10);
    --green:#6ee7a8;
    --amber:#e0b34d;
    --red:#f2735f;
    --gold:#5fe0a8;
    --gold-2:#a7f7cf;
    --gold-3:#6c878e;
    --cyan:#6ee7a8;
    --holo-1:#1f9c86;
    --holo-2:#7cf0c0;
    --holo-3:#9bf7d2;
    --sans:"Inter","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,"Courier New",monospace;
  }

  body{
    height:100vh;
    overflow:hidden;
    display:grid;
    grid-template-rows:auto 1fr auto;
    background:#080a0a;
    color:var(--text);
    font-family:var(--sans);
    font-size:16px;
    -webkit-font-smoothing:antialiased;
  }

  /* 全息网格 */
  body::before{
    content:"";position:fixed;inset:-120px;z-index:-2;pointer-events:none;
    background-image:
      linear-gradient(rgba(95,224,168,.045) 1px,transparent 1px),
      linear-gradient(90deg,rgba(95,224,168,.045) 1px,transparent 1px),
      linear-gradient(rgba(95,224,168,.018) 1px,transparent 1px),
      linear-gradient(90deg,rgba(95,224,168,.018) 1px,transparent 1px);
    background-size:96px 96px,96px 96px,16px 16px,16px 16px;
    animation:drift 24s linear infinite;
  }
  /* 全息投影：中心聚光 + 暗角 + 扫描线 */
  body::after{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(1120px 560px at 50% -12%,rgba(95,224,168,.11),transparent 68%),
      radial-gradient(circle at 50% 44%,rgba(0,0,0,0) 32%,rgba(0,0,0,.55) 100%),
      repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px);
  }

  ::selection{background:rgba(95,224,168,.28);color:#eafffd}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#22332d;border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:#2e4a40}

  /* ---------- 顶栏 ---------- */
  .topbar{
    position:relative;z-index:2;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:10px 18px;
    background:linear-gradient(180deg,#0c1211,#090d0c);
    border-bottom:1px solid var(--line);
  }
  .topbar::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(95,224,168,.9) 30%,rgba(126,255,205,.75) 62%,rgba(167,247,207,.45) 84%,transparent);
    background-size:58% 100%;background-repeat:no-repeat;
    animation:sheen 4.5s linear infinite;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .mark{
    position:relative;width:32px;height:32px;flex:none;
    display:grid;place-items:center;
    border:1px solid var(--accent);border-radius:8px;
    background:rgba(95,224,168,.07);
    color:var(--accent-2);font-size:9.5px;font-weight:700;letter-spacing:1px;
    animation:markPulse 3.6s ease-in-out infinite;
  }
  .mark::after{content:"";position:absolute;inset:-3px;border:1px solid rgba(95,224,168,.30);border-radius:10px}
  .brand-text{display:flex;flex-direction:column;gap:2px;min-width:0}
  .brand h1{
    margin:0;font-size:20px;font-weight:600;letter-spacing:1px;line-height:1.2;
    white-space:nowrap;
    background:linear-gradient(90deg,#f4fcf8,#cdeee0 42%,#7cf0c0 74%,#9bf7d2);
    background-size:200% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:holoShift 16s linear infinite;
  }
  .brand h1::after{
    content:"";display:inline-block;width:2px;height:16px;margin-left:7px;
    background:var(--accent);vertical-align:-2px;
    animation:blink 1.1s steps(1) infinite;
  }
  .chips{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 11px;border:1px solid rgba(255,255,255,.06);border-radius:999px;
    background:linear-gradient(135deg,rgba(38,180,155,.10),rgba(95,224,168,.05));
    color:var(--muted);
    font-size:12px;letter-spacing:.2px;white-space:nowrap;
  }
  .chip::before{
    content:"";width:5px;height:5px;border-radius:50%;flex:none;
    background:var(--green);box-shadow:0 0 7px var(--green);
    animation:pulse 1.8s ease-in-out infinite;
  }
  .chip b{color:var(--holo-2);font-weight:600}
  .chip.is-static::before{background:var(--accent);box-shadow:0 0 7px var(--accent)}

  /* ---------- 布局：满屏三栏 ---------- */
  .layout{
    display:grid;
    grid-template-columns:minmax(0,1.15fr) minmax(0,0.8fr) minmax(0,1fr);
    gap:12px;padding:12px 18px;
    min-height:0;overflow:hidden;
  }
  .col{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}

  /* ---------- 仪器面板 ---------- */
  .card{
    position:relative;display:flex;flex-direction:column;
    min-height:0;padding:0;overflow:auto;
    border:1px solid rgba(255,255,255,.07);border-radius:12px;
    background:
      repeating-linear-gradient(60deg,rgba(95,224,168,.032) 0 1px,transparent 1px 13px),
      repeating-linear-gradient(-60deg,rgba(95,224,168,.032) 0 1px,transparent 1px 13px),
      repeating-linear-gradient(0deg,rgba(95,224,168,.020) 0 1px,transparent 1px 13px),
      linear-gradient(180deg,rgba(95,224,168,.07),rgba(95,224,168,0) 150px),
      linear-gradient(180deg,rgba(18,21,21,.94),rgba(10,12,12,.97));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
    animation:rise .4s ease both;
    transition:border-color .2s ease,box-shadow .25s ease;
  }
  .card:hover{
    border-color:rgba(95,224,168,.42);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 0 1px rgba(95,224,168,.18),0 0 34px -8px rgba(95,224,168,.32),0 18px 34px -22px rgba(0,0,0,.9);
  }
  .card-title{
    position:sticky;top:0;z-index:4;flex:none;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:9px 14px 9px 22px;
    border-radius:12px 12px 0 0;
    font-size:14px;font-weight:600;letter-spacing:.6px;color:var(--accent-2);
    background:linear-gradient(90deg,rgba(95,224,168,.075),rgba(95,224,168,.025));
    border-bottom:1px solid rgba(255,255,255,.06);
    backdrop-filter:blur(2px);
  }
  .card-title::before{
    content:"";position:absolute;left:9px;top:50%;transform:translateY(-50%);
    width:5px;height:5px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 9px rgba(95,224,168,.9);
    animation:pulse 2.8s ease-in-out infinite;
  }
  .card-title::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(167,247,207,.9) 30%,rgba(95,224,168,.55) 62%,transparent);
    background-size:42% 100%;background-repeat:no-repeat;
    animation:sheen 4.6s linear infinite;
  }
  .card-title > :first-child{margin-right:auto}
  .card-title .extra{font-size:12px;letter-spacing:.4px;color:var(--muted);font-weight:400}
  .card-title .extra.count{color:var(--accent);letter-spacing:.2px}
  .card-title .extra.count b{color:var(--accent-2);font-weight:700;font-size:13px}

  .col-left .card:nth-child(1){flex:0 0 auto}
  .col-left .card:nth-child(2){flex:1 1 auto}
  .col-mid > .card:first-child{flex:0 0 auto}
  .pair{
    display:grid;grid-template-columns:1fr 1fr;
    gap:12px;flex:1 1 auto;min-height:0;
  }
  .col-right .card{flex:1 1 auto;overflow:hidden}

  /* ---------- 流派 ---------- */
  .build-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(208px,1fr));gap:8px;padding:12px}
  .build-btn{
    position:relative;appearance:none;cursor:pointer;text-align:left;
    padding:9px 42px 9px 13px;overflow:hidden;
    border:1px solid var(--line);border-radius:8px;
    background:var(--panel-2);color:var(--text);
    font-family:var(--sans);
    transition:border-color .14s ease,background .14s ease,color .14s ease,transform .14s ease,box-shadow .2s ease;
  }
  .build-btn .bicon{
    position:absolute;right:7px;top:50%;width:34px;height:34px;
    transform:translateY(-50%);opacity:.6;pointer-events:none;
    transition:opacity .14s ease;
    animation:iconFloat 5s ease-in-out infinite;
  }
  .build-btn:nth-child(2n) .bicon{animation-delay:-2.5s}
  .build-btn::before{
    content:"";position:absolute;left:0;top:5px;bottom:5px;width:2px;
    background:var(--accent);opacity:0;transition:opacity .14s ease;
  }
  .build-btn:hover{border-color:var(--accent);background:#0f1614;transform:translateY(-2px);box-shadow:0 0 18px -6px rgba(95,224,168,.45)}
  .build-btn .bname{display:block;font-size:17px;font-weight:600;letter-spacing:.2px;color:var(--text)}
  .build-btn .bmeta{display:block;margin-top:4px;font-size:13px;color:var(--muted);line-height:1.45;white-space:normal;overflow-wrap:anywhere}
  .build-btn.is-active{
    border-color:rgba(38,180,155,.8);
    background:linear-gradient(120deg,rgba(95,224,168,.16),rgba(38,180,155,.26) 45%,rgba(126,255,205,.14) 70%,rgba(95,224,168,.16));
    background-size:220% 100%;
    box-shadow:inset 0 0 0 1px rgba(38,180,155,.25);
    animation:buildGlow 2.6s ease-in-out infinite,holoShift 9s linear infinite;
  }
  .build-btn:hover .bicon{opacity:.9}
  .build-btn.is-active::before{opacity:1;background:linear-gradient(180deg,var(--accent),var(--holo-1))}
  .build-btn.is-active .bicon{opacity:1;filter:drop-shadow(0 0 8px rgba(38,180,155,.75))}
  .build-btn.is-active .bname{color:#a7f7cf}
  .build-btn.is-active .bmeta{color:var(--accent)}

  /* ---------- 配置 ---------- */
  .fields{display:flex;flex-direction:column;gap:8px;padding:12px 14px}
  .field{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:8px}
  .field > span{font-size:13px;letter-spacing:.3px;color:var(--muted);text-align:right;white-space:nowrap}
  .field select{
    width:100%;appearance:none;cursor:pointer;font-family:var(--sans);
    padding:8px 24px 8px 9px;font-size:15px;
    border:1px solid var(--line);border-radius:8px;
    background:#0a100e url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='9' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%235fe0a8' stroke-width='1.4' fill='none' stroke-linecap='round'/></svg>") no-repeat right 8px center;
    color:var(--text);
    transition:border-color .14s ease,box-shadow .14s ease;
  }
  .field select:hover{border-color:var(--line-strong)}
  .field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(95,224,168,.14)}
  .field select option{background:#0b171b;color:var(--text)}
  .field select option:disabled{color:#456066}

  /* ---------- 已选词条 ---------- */
  .affix-sum-list{
    display:flex;flex-direction:column;gap:6px;
    padding:12px 14px;flex:1 1 auto;min-height:0;overflow:auto;
  }
  .affix-sum-row{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 10px;border:1px solid var(--line);border-radius:8px;
    background:var(--panel-2);
    animation:rowIn .34s ease both;
    transition:border-color .14s ease,background .14s ease;
  }
  .affix-sum-row:hover{border-color:var(--line-strong);background:#0f1614}
  .affix-sum-row .as-label{font-size:15px;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .affix-sum-row .as-label i{font-style:normal;color:var(--muted);margin-left:4px}
  .affix-sum-row .as-value{font-size:15px;font-weight:600;color:var(--accent-2);white-space:nowrap;font-variant-numeric:tabular-nums}
  .affix-sum-row .as-value small{font-weight:400;color:var(--muted);margin-left:4px;font-size:12px}
  .empty-hint{padding:18px 8px;text-align:center;color:#4f6a72;font-size:13px;letter-spacing:.5px;line-height:1.7}

  /* ---------- 天赋 ---------- */
  .talent-group{
    display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;
    padding:10px 14px;border-bottom:1px dashed var(--line);
  }
  .talent-group:first-child{padding-top:12px}
  .talent-group:last-child{border-bottom:none;padding-bottom:12px}
  .talent-name{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
  .talent-name b{font-size:14px;color:var(--accent-2);font-weight:600;letter-spacing:.6px}
  .talent-name .ratio{font-size:12px;color:var(--muted)}
  .talent-detail{margin-bottom:8px;min-width:0}
  .talent-detail:last-child{margin-bottom:0}
  .talent-line{display:flex;justify-content:space-between;gap:10px;font-size:14px;line-height:1.5}
  .talent-line .k{color:var(--muted);white-space:nowrap}
  .talent-line .v{color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
  .talent-line .v b{color:var(--accent-2);font-weight:600}
  .talent-bar{position:relative;height:5px;margin-top:5px;border-radius:3px;background:#101816;box-shadow:inset 0 0 0 1px rgba(95,224,168,.14)}
  .talent-bar i{
    position:relative;display:block;height:100%;border-radius:3px;overflow:hidden;
    background:linear-gradient(90deg,#5fe0a8,#2fbf8a 38%,#7cf0c0 76%,#a7f7cf);
    transition:width .5s ease,background .3s ease;
  }
  .talent-bar i.is-full{
    background:linear-gradient(90deg,#e8a33d,#ff8a3d);
    box-shadow:0 0 8px rgba(255,138,61,.45);
    animation:fullGlow 2s ease-in-out infinite;
  }
  .talent-bar i::after{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(90deg,rgba(4,24,26,.55) 0 2px,transparent 2px 5px);
    animation:flow 2.4s linear infinite;
  }

  /* ---------- 汇总属性 ---------- */
  .attr-list{
    display:grid;grid-template-columns:1fr;gap:0;
    padding:8px 14px 12px;flex:1 1 auto;min-height:0;overflow:auto;
  }
  .attr-row{
    display:flex;align-items:baseline;justify-content:space-between;gap:8px;
    padding:5px 3px;border-bottom:1px dotted #1b2b31;
    animation:rowIn .34s ease both;
  }
  .attr-row:hover{background:rgba(95,224,168,.05);box-shadow:inset 2px 0 0 var(--accent)}
  .attr-row .attr-label{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .attr-row .attr-value{display:flex;align-items:baseline;gap:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .attr-row .main{font-size:16px;font-weight:600;color:var(--ink)}
  .attr-row .raw{font-size:12px;color:#5f7d85}
  .attr-row .danger{color:var(--red)}
  .attr-row .good{color:var(--green)}

  /* ---------- 词条矩阵 ---------- */
  .table-card{padding:0}
  .table-scroll{flex:1 1 auto;min-height:0;overflow:auto;border:none}
  table{table-layout:fixed;width:100%;border-collapse:separate;border-spacing:0;font-size:10px}
  thead th{
    position:sticky;top:0;z-index:3;
    padding:8px 2px;
    background:#0a100e;
    border-bottom:1px solid var(--line-strong);
    font-size:12px;font-weight:600;letter-spacing:.3px;color:var(--muted);white-space:nowrap;
  }
  thead th.row-head{left:0;z-index:5;width:112px;text-align:left;padding-left:14px;color:var(--accent-2)}
  thead th .col-label{display:block;font-size:14px;letter-spacing:.1px;color:var(--text);transition:color .14s ease,text-shadow .14s ease}
  thead th:hover .col-label{color:#a7f7cf;text-shadow:0 0 10px rgba(38,180,155,.55)}
  thead th .col-label.weapon{color:var(--accent-2)}
  thead th .col-count{display:block;margin-top:2px;font-size:11px;font-weight:400;color:#6a837a;font-variant-numeric:tabular-nums}
  thead th.is-over{box-shadow:inset 0 -1px 0 var(--red)}
  thead th.is-over .col-count{color:var(--red)}
  tbody th.row-head{
    position:sticky;left:0;z-index:2;
    padding:5px 6px 5px 14px;
    background:#0b161a;
    border-bottom:1px solid #122026;border-right:1px solid var(--line);
    text-align:left;font-size:14px;font-weight:400;color:var(--text);white-space:nowrap;
  }
  tbody td{border-bottom:1px solid #122026;padding:2px;text-align:center}
  tbody tr.is-group-start th.row-head,
  tbody tr.is-group-start td{border-top:1px solid var(--line-strong)}
  tbody tr:hover td{background:rgba(95,224,168,.05)}
  tbody tr:hover th.row-head{background:#101a17;color:var(--accent-2)}
  .cell-btn{
    width:100%;height:30px;padding:0;
    display:inline-flex;align-items:center;justify-content:center;
    border:1px solid #1b2a26;border-radius:5px;
    background:#0a100e;color:#8ba69b;
    font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;
    cursor:pointer;transition:border-color .12s ease,background .12s ease,color .12s ease,box-shadow .12s ease;
  }
  .cell-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent-2);background:rgba(95,224,168,.08)}
  .cell-btn:active:not(:disabled){transform:translateY(1px)}
  .cell-btn.is-active{
    border-color:var(--accent);background:linear-gradient(135deg,#5fe0a8,#1f9c86);color:#04150f;font-weight:700;
    box-shadow:0 0 8px rgba(38,180,155,.45);
    transition:box-shadow .18s ease,border-color .18s ease;
  }
  .cell-btn.is-active:hover{
    border-color:var(--accent-2);
    box-shadow:0 0 24px rgba(95,224,168,.85);
  }
  .cell-btn:disabled{color:#2f4239;background:#0a100e;border-color:#15211d;cursor:not-allowed}
  td.is-over .cell-btn:not(:disabled){border-color:rgba(242,115,95,.5)}

  /* ---------- 页脚 ---------- */
  .foot{
    padding:8px 18px;
    border-top:1px solid var(--line);
    background:#080f12;
    color:var(--muted);font-size:12px;letter-spacing:.3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .foot code{color:var(--accent-2)}

  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes flow{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
  @keyframes sheen{from{background-position:-45% 0}to{background-position:145% 0}}
  @keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(96px,96px,0)}}
  @keyframes buildGlow{
    0%,100%{box-shadow:inset 0 0 0 1px rgba(38,180,155,.25),0 0 0 0 rgba(95,224,168,0)}
    50%{box-shadow:inset 0 0 0 1px rgba(38,180,155,.6),0 0 24px -2px rgba(95,224,168,.45),0 0 18px -4px rgba(38,180,155,.55)}
  }
  @keyframes iconFloat{0%,100%{transform:translateY(-50%)}50%{transform:translateY(calc(-50% - 4px))}}
  @keyframes fullGlow{0%,100%{box-shadow:0 0 7px rgba(255,138,61,.35)}50%{box-shadow:0 0 20px rgba(255,138,61,.9)}}
  @keyframes markPulse{0%,100%{box-shadow:0 0 0 0 rgba(38,180,155,0)}50%{box-shadow:0 0 22px -2px rgba(38,180,155,.7)}}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.12}}
  @keyframes rowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes holoShift{from{background-position:0% 50%}to{background-position:200% 50%}}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
  }

  @media (max-height:820px){
    .topbar{padding:7px 16px}
    .brand h1{font-size:17px;letter-spacing:1.6px}
    .layout{padding:8px 14px;gap:10px}
    .card-title{padding:7px 12px 7px 14px;font-size:12.5px}
    .build-grid{gap:6px;padding:9px;grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
    .build-btn{padding:7px 38px 7px 11px}
    .build-btn .bicon{width:28px;height:28px;right:5px}
    .build-btn .bname{font-size:14px}
    .build-btn .bmeta{font-size:11.5px;margin-top:3px}
    .fields{padding:9px 12px;gap:6px}

  var SPECIAL = {
    MAX_EXTERNAL_ATTACK: { minKey: 'MIN_EXTERNAL_ATTACK', label: '外功攻击' },
    MAX_MINGJIN_ATTACK: { minKey: 'MIN_MINGJIN_ATTACK', label: '鸣金攻击' },
    MAX_LIESHI_ATTACK: { minKey: 'MIN_LIESHI_ATTACK', label: '裂石攻击' },

  };

  var RATE_KEYS = { ACCURACY_RATE: 100, CRITICAL_RATE: 80, INSIGHT_RATE: 40 };

  /* ---------- 基础数值工具 ---------- */

  function num(v) {
    var n = Number(v);
    return Number.isFinite(n) ? n : 0;
  }

  function roundTo(v, d) {
    d = d == null ? 0 : d;
    if (!Number.isFinite(v)) return 0;
    var p = Math.pow(10, d);
    var x = v * p;
    var r = x < 0 ? -Math.round(-x + 1e-9) : Math.round(x + 1e-9);
    return r / p;
  }

  function fmtRaw(v) {
    return roundTo(v, 4).toFixed(4).replace(/(?:\.0+|(\.\d*?[1-9])0+)$/, '$1');
  }

  function disp(v) {
    var t = roundTo(v, 2);
    return Number.isInteger(t) ? String(t) : t.toFixed(2);
  }

  function kFormat(s) {
    return String(s).replace(/-?\d+\.\d+/g, function (m) { return disp(Number(m)); });
  }

  function keyName(k, fallback) {
    var m = K[k];
    return (m && m.name) || fallback || k;
  }

  function isPercent(k) {
    return !!(K[k] && K[k].isPercent);
  }

  function isRateKey(k) {
    return Object.prototype.hasOwnProperty.call(RATE_KEYS, k);
  }

  function stringifyAttr(key, value) {
    var s = fmtRaw(value);
    return isPercent(key) ? s + '%' : s;
  }

  function accConvert(v, lr) {
    var base = 65;
    if (!Number.isFinite(lr) || lr <= 0) return v;
    return base + Math.max(v - base, 0) / lr;
  }

  function computed(key, value, map) {
    var v = roundTo(value, 4);
    if (!isRateKey(key)) return v;
    var lr = num(map.LEVEL_RESISTANCE);
    if (key === 'ACCURACY_RATE') return Number(accConvert(v, lr).toFixed(4));
    return Number((lr > 0 ? v / lr : v).toFixed(4));
  }

  function combineCritical(acc, crit, directCrit, insight, directInsight) {
    var a = Math.min(Math.max(acc, 0), 100);
    var o = roundTo(Math.min(Math.max(crit, 0), 80) + directCrit, 4);
    var r = roundTo(Math.min(Math.max(insight, 0), 40) + directInsight, 4);
    var l = (r + o > 100) ? a * Math.max(0, 100 - r) / 100 : a * o / 100;
    return l;
  }

  /* ---------- 元数据索引 ---------- */

  var EQ_LIST = D.equipments.map(function (e) {
    return {
      key: e.key,
      name: e.name,
      type: e.type,
      goldenAttr: e.goldenAttr || [],
      firstTuningKeys: D.tunings.filter(function (t) {
        return (t.firstEquipmentKeys || []).indexOf(e.key) >= 0;
      }).map(function (t) { return t.key; }),
      secondaryTuningKeys: D.tunings.filter(function (t) {
        return (t.secondaryEquipmentKeys || []).indexOf(e.key) >= 0;
      }).map(function (t) { return t.key; }),
      pitchKeys: D.pitches.filter(function (p) {
        return (p.equipmentKeys || []).indexOf(e.key) >= 0;
      }).map(function (p) { return p.key; })
    };
  });

  var EQ_BY_KEY = {};
  EQ_LIST.forEach(function (e) { EQ_BY_KEY[e.key] = e; });

  var TUNING_BY_KEY = {};
  D.tunings.forEach(function (t) { TUNING_BY_KEY[t.key] = t; });

  var PITCH_BY_KEY = {};
  D.pitches.forEach(function (p) { PITCH_BY_KEY[p.key] = p; });

  var MIND_BY_KEY = {};
  D.minds.forEach(function (m) { MIND_BY_KEY[m.key] = m; });

  var SET_BY_KEY = {};
  D.sets.forEach(function (s) { SET_BY_KEY[s.key] = s; });

  var ARSENAL_BY_KEY = {};
  D.arsenals.forEach(function (a) { ARSENAL_BY_KEY[a.key] = a; });

  function unitMeta(key) {
    var t = TUNING_BY_KEY[key];
    if (t) {
      var a = num(t.baseValue != null ? t.baseValue : t.maxValue);
      return { chengyinValue: a, maxValue: num(t.maxValue != null ? t.maxValue : a) };
    }
    var p = PITCH_BY_KEY[key];
    if (p) {
      var m = num(p.maxValue);
      return { chengyinValue: m, maxValue: m };
    }
    return null;
  }

  function martialsByBuild(build) {
    return D.martials.filter(function (m) { return m.buildKey === build; });
  }

  function slotEquipment(build) {
    var ms = martialsByBuild(build).slice(0, 2);
    return {
      weaponOne: ms[0] ? (ms[0].equipmentKey || null) : null,
      weaponTwo: ms[1] ? (ms[1].equipmentKey || null) : null,
      ring: EQ_SLOT.ring,
      pendant: EQ_SLOT.pendant,
      head: EQ_SLOT.head,
      cloth: EQ_SLOT.cloth,
      shoe: EQ_SLOT.shoe,
      hand: EQ_SLOT.hand
    };
  }

  function resolveKey(rowKey, partKey, build) {
    if (rowKey !== 'SPIRIT') return rowKey;
    if (partKey === 'weaponOne' || partKey === 'weaponTwo') {
      var eq = slotEquipment(build)[partKey];
      return eq ? (DAMAGE_BY_EQ[eq] || null) : null;
    }
    return SPIRIT_SLOT_KEY[partKey] || null;
  }

  function maxCountOf(rowKey, partKey, build) {
    var eq = slotEquipment(build)[partKey];
    var key = resolveKey(rowKey, partKey, build);
    if (!eq || !key) return 0;
    var item = EQ_BY_KEY[eq];
    if (!item) return 0;
    var all = item.firstTuningKeys.concat(item.secondaryTuningKeys, item.pitchKeys);
    var c = 0;
    for (var i = 0; i < all.length; i++) if (all[i] === key) c++;
    return c;
  }

  /* ---------- 词条汇总 ---------- */

  function mergeEntries(entries, base) {
    var out = {};
    if (base) {
      Object.keys(base).forEach(function (k) { out[k] = num(base[k]); });
    }
    (entries || []).forEach(function (e) {
      if (!e || !e.key) return;
      out[e.key] = num(out[e.key]) + num(e.value);
    });
    return out;
  }

  function rowIndexOf(key) {
    for (var i = 0; i < ROWS.length; i++) if (ROWS[i].key === key) return i;
    return 0;
  }

  function affixSnapshot(build, affixCounts) {
    var cells = [];
    var entries = [];
    var agg = {};
    var aggOrder = [];
    var colCounts = {};
    var total = 0;

    PARTS.forEach(function (p) { colCounts[p.key] = 0; });

    ROWS.forEach(function (row) {
      PARTS.forEach(function (part) {
        var cellKey = row.key + '::' + part.key;
        var key = resolveKey(row.key, part.key, build);
        var max = maxCountOf(row.key, part.key, build);
        var count = Math.min(Math.max(0, Math.floor(num(affixCounts[cellKey]))), max);

          cellKey: cellKey,
          rowKey: row.key,
          partKey: part.key,
          key: key,
          count: count,
          max: max,
          unit: unit,
          disabled: max <= 0 || !meta
        });

        if (count <= 0 || !key || !meta) return;
        var value = count * unit;
        entries.push({ key: key, value: value });
        colCounts[part.key] += count;
        total += count;

        if (!agg[key]) {
          agg[key] = { key: key, label: keyName(key), count: 0, unitValue: unit, totalValue: 0 };
          aggOrder.push(key);
        }
        agg[key].count += count;
        agg[key].totalValue += value;
      });
    });

    var summaryRows = aggOrder.map(function (k) { return agg[k]; });
    summaryRows.sort(function (a, b) {
      if (a.count !== b.count) return b.count - a.count;
      return rowIndexOf(a.key) - rowIndexOf(b.key);

    return {
      cells: cells,
      entries: entries,
      summaryRows: summaryRows,
      columnCounts: colCounts,
      totalCount: total

  }

  function applyBenefit(source, equipmentSource) {
    var out = {};
    var keys = {};
    Object.keys(source || {}).forEach(function (k) { keys[k] = true; });
    Object.keys(equipmentSource || {}).forEach(function (k) { keys[k] = true; });
    Object.keys(keys).forEach(function (k) {
      var totalRaw = num(source[k]);
      var equipRaw = num(equipmentSource[k]);
      var br = num(source.BENEFIT_RESISTANCE);
      if (!BENEFIT_KEYS.has(k) || br <= 0 || equipRaw === 0) {
        out[k] = totalRaw;
      } else {
        var nonEquip = totalRaw - equipRaw;
        out[k] = roundTo(nonEquip + equipRaw / br, 8);
      }
    });
    return out;
  }

  function applyConversions(map) {
    var out = {};
    Object.keys(map || {}).forEach(function (k) { out[k] = map[k]; });
    var minV = num(map.MIN);
    var shiV = num(map.SHI);
    var jinV = num(map.JIN);
    var derived = [
      { key: 'MIN_EXTERNAL_ATTACK', value: minV * 0.9 + jinV * 0.22 },
      { key: 'MAX_EXTERNAL_ATTACK', value: shiV * 0.9 + jinV * 1.36 },
      { key: 'CRITICAL_RATE', value: minV * 0.076 },
      { key: 'INSIGHT_RATE', value: shiV * 0.038 }
    ];
    derived.forEach(function (d) {
      if (d.value !== 0) out[d.key] = num(out[d.key]) + d.value;

  /* ---------- 汇总属性行 ---------- */

  function benefitDetail(key, totalRaw, equipRaw, sourceValues) {
    var br = num(sourceValues.BENEFIT_RESISTANCE);
    if (!BENEFIT_KEYS.has(key) || br <= 0 || equipRaw === 0) {
      return {
        totalRawValue: totalRaw,
        effectiveTotalValue: totalRaw,
        equipmentRawValue: equipRaw,
        nonEquipmentRawValue: totalRaw - equipRaw,
        benefitResistance: br,
        enabled: false
      };
    }
    var nonEquip = totalRaw - equipRaw;
    return {
      totalRawValue: totalRaw,
      effectiveTotalValue: roundTo(nonEquip + equipRaw / br, 8),
      equipmentRawValue: equipRaw,
      nonEquipmentRawValue: nonEquip,
      benefitResistance: br,
      enabled: true
    };
  }

  function rangeText(a, b) {
    if (a > b) return fmtRaw(a) + '↑';
    if (a === b) return fmtRaw(a);
    return fmtRaw(a) + '-' + fmtRaw(b);
  }

  function buildRows(build, sourceValues, equipmentSourceValues, combined) {
    var acc = {};
    var order = [];

    function add(key, value) {
      if (!Object.prototype.hasOwnProperty.call(acc, key)) {
        order.push(key);
        acc[key] = 0;
      }
      acc[key] = num(acc[key]) + num(value);
    }

    Object.keys(sourceValues).forEach(function (k) { add(k, sourceValues[k]); });

    var minV = num(sourceValues.MIN);
    var shiV = num(sourceValues.SHI);
    var jinV = num(sourceValues.JIN);
    if (minV * 0.9 + jinV * 0.22 !== 0) add('MIN_EXTERNAL_ATTACK', minV * 0.9 + jinV * 0.22);
    if (shiV * 0.9 + jinV * 1.36 !== 0) add('MAX_EXTERNAL_ATTACK', shiV * 0.9 + jinV * 1.36);
    if (minV * 0.076 !== 0) add('CRITICAL_RATE', minV * 0.076);
    if (shiV * 0.038 !== 0) add('INSIGHT_RATE', shiV * 0.038);

    Object.keys(SPECIAL).forEach(function (k) {
      if (order.indexOf(k) >= 0) return;
      var spec = SPECIAL[k];
      if (num(sourceValues[spec.minKey]) !== 0) order.push(k);
    });

    var rows = [];

    order.forEach(function (k) {
      if (HIDDEN.has(k)) return;
      var rawValue = roundTo(acc[k] || 0, 2);
      var spec = SPECIAL[k];

      if (spec) {
        var minValue = num(acc[spec.minKey]);
        if (rawValue === 0 && minValue === 0) return;
        var primary = (k === 'MAX_WUXIANG_ATTACK')
          ? fmtRaw(minValue) + '-' + fmtRaw(rawValue)
          : rangeText(minValue, rawValue);
        rows.push({
          key: k,
          label: spec.label,
          sortValue: Math.max(rawValue, minValue),
          primaryValue: primary,
          secondaryValue: '',
          valueTone: ''
        });
        return;
      }

      if (rawValue === 0) return;

      if (!isRateKey(k)) {
        rows.push({
          key: k,
          label: keyName(k),
          sortValue: rawValue,
          primaryValue: stringifyAttr(k, rawValue),
          secondaryValue: '',
          valueTone: ''
        });
        return;
      }

      var c = computed(k, rawValue, acc);
      rows.push({
        key: k,
        label: keyName(k),
        sortValue: rawValue,
        primaryValue: fmtRaw(rawValue) + '%',
        secondaryValue: '(' + c.toFixed(2) + '%)',
        valueTone: ''
      });
    });

    rows = rows.map(function (row, index) {
      var r = {
        key: row.key,
        label: row.label,
        sortValue: row.sortValue,
        primaryValue: kFormat(row.primaryValue),
        secondaryValue: row.secondaryValue ? kFormat(row.secondaryValue) : '',
        valueTone: row.valueTone || '',
        _index: index,
        _weight: num(WEIGHTS[row.key])
      };
      return r;
    });

    rows.sort(function (a, b) {
      if (a._weight !== b._weight) return b._weight - a._weight;
      return a._index - b._index;
    });

    rows = rows.map(function (row) {
      var out = { key: row.key, label: row.label, sortValue: row.sortValue, primaryValue: row.primaryValue, secondaryValue: row.secondaryValue, valueTone: row.valueTone };

      if (isRateKey(out.key)) {
        var threshold = RATE_KEYS[out.key];
        var rawCombined = num(combined[out.key]);
        var real = computed(out.key, rawCombined, combined);
        var capped = Math.min(Math.max(real, 0), threshold);
        var overflow = Math.max(real - capped, 0);
        out.primaryValue = disp(rawCombined) + '%';
        out.secondaryValue = '(' + disp(capped) + '%' + (overflow > 0 ? '，溢出 ' + disp(overflow) + '%' : '') + ')';
      } else if (BENEFIT_KEYS.has(out.key)) {
        var raw = num(sourceValues[out.key]);
        var detail = benefitDetail(out.key, raw, num(equipmentSourceValues[out.key]), sourceValues);
        if (detail.enabled) {
          out.primaryValue = stringifyAttr(out.key, raw);
          out.secondaryValue = '(' + (isPercent(out.key) ? detail.effectiveTotalValue.toFixed(2) + '%' : detail.effectiveTotalValue.toFixed(2)) + ')';
        }
      }
      return out;
    });

    if (build === 'LIESHI_JUN') {
      var at = -1;
      for (var i = 0; i < rows.length; i++) if (rows[i].key === 'CRITICAL_RATE') { at = i; break; }
      var effRow = effectiveCriticalRow(combined);
      if (at >= 0) rows.splice(at + 1, 0, effRow);
      else rows.push(effRow);
    }

    return rows;
  }

  function effectiveCriticalRow(combined) {
    var acc = computed('ACCURACY_RATE', num(combined.ACCURACY_RATE), combined);
    var crit = computed('CRITICAL_RATE', num(combined.CRITICAL_RATE), combined);
    var insight = computed('INSIGHT_RATE', num(combined.INSIGHT_RATE), combined);
    var directCrit = num(combined.DIRECT_CRITICAL_RATE);
    var directInsight = num(combined.DIRECT_INSIGHT_RATE);
    var v = roundTo(combineCritical(acc, crit, directCrit, insight, directInsight), 2);
    return {
      key: 'LIESHI_JUN_EFFECTIVE_CRITICAL_RATE',
      label: '生效会心',
      sortValue: v,
      primaryValue: disp(v) + '%',
      secondaryValue: '',
      valueTone: v < 75 ? 'danger' : ''
    };
  }

  /* ---------- 整体计算 ---------- */

  function computeAll(build, workspace) {
    var martials = martialsByBuild(build).slice(0, 2);
    var minds = workspace.mindSlots.map(function (k) { return k ? MIND_BY_KEY[k] : null; }).filter(Boolean);
    var affix = affixSnapshot(build, workspace.affixCounts);

    var equipEntries = [];
    Object.keys(slotEquipment(build)).forEach(function (slot) {
      var eq = slotEquipment(build)[slot];
      if (!eq || !EQ_BY_KEY[eq]) return;
      EQ_BY_KEY[eq].goldenAttr.forEach(function (a) {
        equipEntries.push({ key: a.key, value: a.value });
      });
    });
    affix.entries.forEach(function (e) { equipEntries.push({ key: e.key, value: e.value }); });

    var weaponSet = SET_BY_KEY[workspace.weaponSetKey];
    if (weaponSet) weaponSet.attr.forEach(function (a) { equipEntries.push({ key: a.key, value: a.value }); });

    var bowSet = SET_BY_KEY[workspace.bowSetKey];
    if (bowSet) bowSet.attr.forEach(function (a) { equipEntries.push({ key: a.key, value: a.value }); });

    var arsenal = ARSENAL_BY_KEY[workspace.arsenalKey];
    if (arsenal) arsenal.attr.forEach(function (a) { equipEntries.push({ key: a.key, value: a.value }); });

    var baseEntries = D.attributes.map(function (a) { return { key: a.key, value: a.value }; });
    var martialEntries = [];
    martials.forEach(function (m) {
      (m.attr || []).forEach(function (a) { martialEntries.push({ key: a.key, value: a.value }); });
    });
    var mindEntries = [];
    minds.forEach(function (m) {
      (m.attr || []).forEach(function (a) { mindEntries.push({ key: a.key, value: a.value }); });
    });

    var merged = mergeEntries([].concat(baseEntries, equipEntries, martialEntries, mindEntries));

    var src = mergeEntries([], merged);
    var talentMap = {};
    martials.forEach(function (m) {
      var details = [];
      var pairs = m.needKey1 || [];
      for (var i = 0; i < pairs.length; i += 2) {
        var detect = pairs[i];
        var reward = pairs[i + 1];
        if (!detect || !detect.key || !reward || !reward.key) continue;
        var need = num(detect.value);
        var current = roundTo(num(src[detect.key]), 2);
        var ratio = need > 0 ? Math.min(Math.max(current / need, 0), 1) : 0;
        var effective = roundTo(num(reward.value) * ratio, 2);
        details.push({
          martialKey: m.key,
          pairIndex: i / 2,
          detectionAttr: { key: detect.key, value: need },
          rewardAttr: { key: reward.key, value: num(reward.value) },
          currentDetectionValue: current,
          progressRatio: ratio,
          isFull: need > 0 && current >= need,
          effectiveRewardAttr: { key: reward.key, value: effective }
        });
        if (effective) src = mergeEntries([{ key: reward.key, value: effective }], src);
      }
      talentMap[m.key] = details;
    });

    var equipSourceMap = mergeEntries(affix.entries);
    var combined = applyConversions(applyBenefit(src, equipSourceMap));
    var rows = buildRows(build, src, equipSourceMap, combined);

    var talentGroups = martials.map(function (m) {
      return {
        martialKey: m.key,
        martialName: keyName(m.key),
        details: talentMap[m.key] || []
      };
    });

    return {
      buildKey: build,
      affix: affix,
      rows: rows,
      combined: combined,
      sourceValues: src,
      talentGroups: talentGroups
    };
  }

  /* ---------- 状态 ---------- */

  var state = {
    buildKey: 'LIESHI_WEI',
    workspaces: {},
    snapshot: null
  };

  function defaultMindSlots(build) {
    var preset = DEFAULT_MINDS[build];
    var slots;
    if (preset && preset.length) {
      slots = preset.slice(0, 4);
    } else {
      slots = D.minds.filter(function (m) { return m.buildKey === build; })
        .slice(0, 4)
        .map(function (m) { return m.key; });
    }
    while (slots.length < 4) slots.push(null);
    return slots;
  }

  function defaultArsenal(build) {
    var ms = martialsByBuild(build);
    return ms.length ? (ms[0].elementKey || null) : null;
  }

  function ensureWorkspace(build) {
    if (!state.workspaces[build]) {
      state.workspaces[build] = {
        mindSlots: defaultMindSlots(build),
        weaponSetKey: DEFAULT_WEAPON_SET[build] || null,
        bowSetKey: DEFAULT_BOW_SET,
        arsenalKey: defaultArsenal(build),
        affixCounts: {}
      };
    }
    return state.workspaces[build];
  }

  /* ---------- 渲染 ---------- */

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderBuildGrid() {
    var el = document.getElementById('buildGrid');
    el.innerHTML = BUILDS.map(function (b) {
      var ms = martialsByBuild(b).slice(0, 2);
      var sub = ms.map(function (m) {
        return keyName(m.key);
      }).join(' / ');
      var icon = BUILD_ICON[b.split('_')[0]];
      return '<button type="button" class="build-btn' + (b === state.buildKey ? ' is-active' : '') + '" data-build="' + esc(b) + '">'
        + (icon ? '<img class="bicon" src="' + icon + '" alt="" draggable="false">' : '')
        + '<span class="bname">' + esc(keyName(b)) + '</span>'
        + '<span class="bmeta">' + esc(sub || '—') + '</span>'
        + '</button>';
    }).join('');
  }

  function mindOptions(slotIndex, current) {
    var w = ensureWorkspace(state.buildKey);
    var used = {};
    w.mindSlots.forEach(function (k, i) {
      if (i !== slotIndex && k) used[k] = true;
    });
    var opts = ['<option value="">未选择</option>'];
    D.minds.forEach(function (m) {
      var dis = used[m.key] ? ' disabled' : '';
      var sel = m.key === current ? ' selected' : '';
      opts.push('<option value="' + esc(m.key) + '"' + dis + sel + '>' + esc(keyName(m.key)) + '</option>');
    });
    return opts.join('');
  }

  function attrSummary(attr) {
    if (!attr || !attr.length) return '';
    return attr.map(function (a) {
      var v = fmtRaw(a.value);
      var sign = a.value > 0 ? '+' : '';
      return keyName(a.key) + ' ' + sign + v + (isPercent(a.key) ? '%' : '');
    }).join(' / ');
  }

  function setOptions(list, current, withAttr) {
    var opts = ['<option value="">未选择</option>'];
    list.forEach(function (item) {
      var label = keyName(item.key);
      if (withAttr) {
        var d = attrSummary(item.attr);
        if (d) label += '（' + d + '）';
      }
      var sel = item.key === current ? ' selected' : '';
      opts.push('<option value="' + esc(item.key) + '"' + sel + '>' + esc(label) + '</option>');
    });
    return opts.join('');
  }

  function renderConfig() {
    var w = ensureWorkspace(state.buildKey);
    var html = '';
    for (var i = 0; i < 4; i++) {
      html += '<label class="field"><span>心法 ' + (i + 1) + '</span><select data-mind="' + i + '">'
        + mindOptions(i, w.mindSlots[i] || '') + '</select></label>';
    }
    html += '<label class="field"><span>武器套装</span><select data-set="weaponSetKey">'
      + setOptions(D.sets.filter(function (s) { return s.type === 0; }), w.weaponSetKey || '') + '</select></label>';
    html += '<label class="field"><span>弓箭套装</span><select data-set="bowSetKey">'
      + setOptions(D.sets.filter(function (s) { return s.type === 1; }), w.bowSetKey || '', true) + '</select></label>';
    html += '<label class="field"><span>武库</span><select data-set="arsenalKey">'
      + setOptions(D.arsenals, w.arsenalKey || '') + '</select></label>';
    document.getElementById('configFields').innerHTML = html;
  }

  function renderTalent(snap) {
    var el = document.getElementById('talentBody');
    var groups = snap.talentGroups.filter(function (g) { return g.details.length > 0; });
    if (!groups.length) {
      el.innerHTML = '<div class="empty-hint">当前流派暂无武学天赋数据</div>';
      return;
    }
    el.innerHTML = groups.map(function (g) {
      var rows = g.details.map(function (d) {
        var pct = Math.round(d.progressRatio * 1000) / 10;
        var detectCurrent = stringifyAttr(d.detectionAttr.key, d.currentDetectionValue);
        var detectNeed = stringifyAttr(d.detectionAttr.key, d.detectionAttr.value);
        var rewardNow = stringifyAttr(d.rewardAttr.key, d.effectiveRewardAttr.value);
        var rewardNeed = stringifyAttr(d.rewardAttr.key, d.rewardAttr.value);
        return '<div class="talent-detail">'
          + '<div class="talent-line"><span class="k">需求属性</span><span class="v">'
          + esc(keyName(d.detectionAttr.key)) + ' <b>' + esc(detectCurrent) + '</b> / ' + esc(detectNeed)
          + '</span></div>'
          + '<div class="talent-bar"><i' + (d.isFull ? ' class="is-full"' : '') + ' style="width:' + Math.min(100, Math.max(0, pct)) + '%"></i></div>'
          + '<div class="talent-line"><span class="k">奖励属性</span><span class="v">'
          + esc(keyName(d.rewardAttr.key)) + ' <b>' + esc(rewardNow) + '</b> / ' + esc(rewardNeed)
          + '</span></div>'
          + '</div>';
      }).join('');
      return '<div class="talent-group">'
        + '<div class="talent-name"><b>' + esc(g.martialName) + '</b><span class="ratio">'
        + g.details.length + ' 条判定</span></div>' + rows + '</div>';
    }).join('');
  }

  function renderSummary(snap) {
    var el = document.getElementById('summaryRows');
    document.getElementById('affixTotal').textContent = String(snap.affix.totalCount);
    if (!snap.rows.length) {
      el.innerHTML = '<div class="empty-hint">当前 DIY 配置暂无属性</div>';
      return;
    }
    el.innerHTML = snap.rows.map(function (r) {
      var hasSecond = !!r.secondaryValue;
      var cls = hasSecond ? 'raw' : 'main';
      var tone = r.valueTone ? ' ' + r.valueTone : '';
      return '<div class="attr-row">'
        + '<span class="attr-label">' + esc(r.label) + '</span>'
        + '<strong class="attr-value">'
        + '<span class="' + cls + tone + '">' + esc(r.primaryValue) + '</span>'
        + (hasSecond ? '<span class="main' + tone + '">' + esc(r.secondaryValue) + '</span>' : '')
        + '</strong></div>';
    }).join('');
  }

  function renderAffixSummary(snap) {
    var el = document.getElementById('affixSummary');
    document.getElementById('affixCount').textContent = snap.affix.totalCount + ' 条';
    if (!snap.affix.summaryRows.length) {
      el.innerHTML = '<div class="empty-hint">右侧勾选词条后显示数量和值</div>';
      return;
    }
    var combined = snap.combined;
    el.innerHTML = snap.affix.summaryRows.map(function (item) {
      var primary = stringifyAttr(item.key, item.totalValue);
      var second = '';
      if (isRateKey(item.key)) {
        var c = item.key === 'ACCURACY_RATE'
          ? accConvert(roundTo(item.totalValue, 4), num(combined.LEVEL_RESISTANCE))
          : computed(item.key, item.totalValue, combined);
        second = '(' + c.toFixed(2) + '%)';
      }
      return '<div class="affix-sum-row">'
        + '<span class="as-label">' + esc(item.label) + '<i>× ' + item.count + '</i></span>'
        + '<span class="as-value">' + esc(primary) + (second ? '<small>' + esc(second) + '</small>' : '') + '</span>'
        + '</div>';
    }).join('');
  }

  function renderTable(snap) {
    var build = snap.buildKey;
    var cells = {};
    snap.affix.cells.forEach(function (c) { cells[c.cellKey] = c; });
    var slots = slotEquipment(build);

    var head = '<thead><tr><th class="row-head">词条</th>';
    PARTS.forEach(function (p) {
      var isWeapon = p.key === 'weaponOne' || p.key === 'weaponTwo';
      var label = p.label;
      var cls = 'col-label';
      if (isWeapon) {
        var eq = slots[p.key];
        label = eq ? (WEAPON_LABEL[eq] || keyName(eq)) : p.label;
        cls += ' weapon';
      }
      var count = snap.affix.columnCounts[p.key] || 0;
      var over = count > 5 ? ' is-over' : '';
      head += '<th class="' + over + '">'
        + '<span class="' + cls + '">' + esc(label) + '</span>'
        + '<span class="col-count">' + count + '/5</span>'
        + '</th>';
    });
    head += '</tr></thead>';

    var body = '<tbody>';
    var lastGroup = null;
    ROWS.forEach(function (row) {
      var groupStart = lastGroup !== null && lastGroup !== row.group;
      lastGroup = row.group;
      body += '<tr' + (groupStart ? ' class="is-group-start"' : '') + '>'
        + '<th class="row-head">' + esc(row.label) + '</th>';
      PARTS.forEach(function (p) {
        var c = cells[row.key + '::' + p.key];
        var over = snap.affix.columnCounts[p.key] > 5 ? ' is-over' : '';
        var disabled = !c || c.disabled;
        var active = c && c.count > 0;
        var text = disabled ? '--' : (c.count + '/' + c.max);
        var partLabel = (p.key === 'weaponOne' || p.key === 'weaponTwo')
          ? (slots[p.key] ? (WEAPON_LABEL[slots[p.key]] || p.label) : p.label)
          : p.label;
        var title = disabled
          ? (row.label + ' / ' + partLabel + '：不可选')
          : (row.label + ' / ' + partLabel + '：' + keyName(c.key) + '，承音值 ' + c.unit);
        body += '<td class="' + over + '">'
          + '<button type="button" class="cell-btn' + (active ? ' is-active' : '') + '"'
          + (disabled ? ' disabled' : '')
          + ' title="' + esc(title) + '"'
          + ' data-row="' + esc(row.key) + '" data-part="' + esc(p.key) + '">'
          + esc(text) + '</button></td>';
      });
      body += '</tr>';
    });
    body += '</tbody>';

    document.getElementById('affixTable').innerHTML = head + body;
  }

  /* ---------- 交互 ---------- */

  function refresh() {
    var w = ensureWorkspace(state.buildKey);
    var snap = computeAll(state.buildKey, w);
    state.snapshot = snap;
    renderTalent(snap);
    renderSummary(snap);
    renderAffixSummary(snap);
    renderTable(snap);
  }

  function selectBuild(build) {
    if (BUILDS.indexOf(build) < 0) return;
    state.buildKey = build;
    ensureWorkspace(build);
    renderBuildGrid();
    renderConfig();
    refresh();
  }

  function setMindSlot(index, value) {
    var w = ensureWorkspace(state.buildKey);
    var v = value || null;
    if (v) {
      var dup = w.mindSlots.some(function (k, i) { return i !== index && k === v; });
      if (dup) return;
    }
    w.mindSlots[index] = v;
    renderConfig();
    refresh();
  }

  function setConfig(field, value) {
    var w = ensureWorkspace(state.buildKey);
    w[field] = value || null;
    refresh();
  }

  function toggleCell(rowKey, partKey) {
    var snap = state.snapshot;
    if (!snap) return;
    var cell = null;
    for (var i = 0; i < snap.affix.cells.length; i++) {
      var c = snap.affix.cells[i];
      if (c.rowKey === rowKey && c.partKey === partKey) { cell = c; break; }
    }
    if (!cell || cell.disabled) return;
    var w = ensureWorkspace(state.buildKey);
    var current = num(w.affixCounts[cell.cellKey]);
    var next = current + 1 > cell.max ? 0 : current + 1;
    if (next === 0) delete w.affixCounts[cell.cellKey];
    else w.affixCounts[cell.cellKey] = next;
    refresh();
  }

  document.getElementById('buildGrid').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-build]');
    if (btn) selectBuild(btn.getAttribute('data-build'));
  });

  document.getElementById('configFields').addEventListener('change', function (e) {
    var t = e.target;
    if (t.hasAttribute('data-mind')) {
      setMindSlot(Number(t.getAttribute('data-mind')), t.value);
    } else if (t.hasAttribute('data-set')) {
      setConfig(t.getAttribute('data-set'), t.value);
    }
  });

  document.getElementById('affixTable').addEventListener('click', function (e) {
    var btn = e.target.closest('.cell-btn');
    if (!btn || btn.disabled) return;
    toggleCell(btn.getAttribute('data-row'), btn.getAttribute('data-part'));
  });

  /* ---------- 启动 ---------- */

  var ver = D.currentVersion || {};
  document.getElementById('versionTag').textContent =
    (ver.key ? ver.key.split('_')[0] : '') + (ver.name ? '·' + ver.name : '');

  renderBuildGrid();
  ensureWorkspace(state.buildKey);
  renderConfig();
  refresh();

  window.__DIY__ = {
    state: state,
    computeAll: computeAll,
    affixSnapshot: affixSnapshot,
    ensureWorkspace: ensureWorkspace,
    selectBuild: selectBuild,
    refresh: refresh
  };
})();

  </script>
</body>
</html>
